<div id="app">
  <header id="menubar">
    <div class="brand" title="Pony Studio"><svg class="ico"><use href="#i-pony"/></svg></div>
    <nav id="menus"></nav>
    <div id="docname"></div>
  </header>
  <div id="toolbar"></div>
  <main id="main">
    <aside id="tools"></aside>
    <section id="stage">
      <canvas id="ruler-top" class="ruler"></canvas>
      <canvas id="ruler-left" class="ruler"></canvas>
      <div id="ruler-corner"></div>
      <div id="stage-view"></div>
      <div id="stage-hud"></div>
    </section>
    <div class="splitter v" id="split-right"></div>
    <aside id="panel">
      <div id="panel-tabs"></div>
      <div id="panel-body"></div>
    </aside>
  </main>
  <div class="splitter h" id="split-timeline"></div>
  <section id="timeline"></section>
  <footer id="statusbar"></footer>
</div>
<div id="overlays"></div>

<script src="util.js"></script>
<script src="stage.js"></script>
<script src="timeline.js"></script>
<script src="panels.js"></script>
<script src="dialogs.js"></script>
<script src="app.js"></script>
